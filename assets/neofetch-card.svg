<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 230" width="850" height="230" shape-rendering="crispEdges">
  <defs>
    <pattern id="scanlinesNeo" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" fill-opacity="0.2"/>
    </pattern>
    <style>
      .mono {
        font-family: ui-monospace, 'Cascadia Mono', 'Segoe UI Mono', 'Liberation Mono', Menlo, Monaco, Consolas, monospace;
      }
      .k { fill: #00ff41; font-size: 13px; font-weight: 700; }
      .v { fill: #e6edf3; font-size: 13px; }
      .hdr { fill: #00ff41; font-size: 14px; font-weight: 700; }
      .sep { fill: #56d364; font-size: 13px; opacity: 0.7; }
    </style>
  </defs>

  <!-- Pixel Frame -->
  <rect x="0" y="0" width="850" height="230" fill="#05080b"/>
  <rect x="6" y="4" width="838" height="3" fill="#00ff41" fill-opacity="0.75"/>
  <rect x="6" y="223" width="838" height="3" fill="#00ff41" fill-opacity="0.75"/>
  <rect x="3" y="7" width="3" height="216" fill="#00ff41" fill-opacity="0.75"/>
  <rect x="844" y="7" width="3" height="216" fill="#00ff41" fill-opacity="0.75"/>
  <rect x="9" y="9" width="832" height="212" fill="#0b1015"/>

  <!-- Left Pixel Emblem (Retro Chip / Kernel Avatar) -->
  <g transform="translate(46, 36)">
    <!-- Chip pins top/bottom -->
    <rect x="28" y="0" width="8" height="12" fill="#00ff41" fill-opacity="0.7"/>
    <rect x="52" y="0" width="8" height="12" fill="#00ff41" fill-opacity="0.7"/>
    <rect x="76" y="0" width="8" height="12" fill="#00ff41" fill-opacity="0.7"/>
    <rect x="100" y="0" width="8" height="12" fill="#00ff41" fill-opacity="0.7"/>
    <rect x="28" y="132" width="8" height="12" fill="#00ff41" fill-opacity="0.7"/>
    <rect x="52" y="132" width="8" height="12" fill="#00ff41" fill-opacity="0.7"/>
    <rect x="76" y="132" width="8" height="12" fill="#00ff41" fill-opacity="0.7"/>
    <rect x="100" y="132" width="8" height="12" fill="#00ff41" fill-opacity="0.7"/>
    <!-- Chip pins left/right -->
    <rect x="0" y="28" width="12" height="8" fill="#00ff41" fill-opacity="0.7"/>
    <rect x="0" y="52" width="12" height="8" fill="#00ff41" fill-opacity="0.7"/>
    <rect x="0" y="76" width="12" height="8" fill="#00ff41" fill-opacity="0.7"/>
    <rect x="0" y="100" width="12" height="8" fill="#00ff41" fill-opacity="0.7"/>
    <rect x="124" y="28" width="12" height="8" fill="#00ff41" fill-opacity="0.7"/>
    <rect x="124" y="52" width="12" height="8" fill="#00ff41" fill-opacity="0.7"/>
    <rect x="124" y="76" width="12" height="8" fill="#00ff41" fill-opacity="0.7"/>
    <rect x="124" y="100" width="12" height="8" fill="#00ff41" fill-opacity="0.7"/>
    <!-- Chip body -->
    <rect x="12" y="12" width="112" height="120" fill="#071a0d"/>
    <rect x="12" y="12" width="112" height="6" fill="#00ff41"/>
    <rect x="12" y="126" width="112" height="6" fill="#00ff41"/>
    <rect x="12" y="12" width="6" height="120" fill="#00ff41"/>
    <rect x="118" y="12" width="6" height="120" fill="#00ff41"/>
    <!-- Pixel 'Z' inside chip -->
    <rect x="38" y="38" width="60" height="12" fill="#00ff41"/>
    <rect x="86" y="50" width="12" height="12" fill="#00ff41"/>
    <rect x="74" y="62" width="12" height="12" fill="#00ff41"/>
    <rect x="62" y="74" width="12" height="12" fill="#00ff41"/>
    <rect x="50" y="86" width="12" height="12" fill="#00ff41"/>
    <rect x="38" y="98" width="60" height="12" fill="#00ff41"/>
  </g>

  <!-- Right Neofetch Spec Output -->
  <text x="230" y="42" class="mono hdr">zakaria@github</text>
  <text x="230" y="58" class="mono sep">────────────────────────────────────────────────────────────</text>

  <text x="230" y="82" class="mono k">OS:</text>
  <text x="315" y="82" class="mono v">Linux</text>

  <text x="230" y="104" class="mono k">Role:</text>
  <text x="315" y="104" class="mono v">Full-Stack Developer</text>

  <text x="230" y="126" class="mono k">Focus:</text>
  <text x="315" y="126" class="mono v">Web Apps, CLI Tools &amp; Open Source</text>

  <text x="230" y="148" class="mono k">Editor:</text>
  <text x="315" y="148" class="mono v">Neovim / VS Code</text>

  <text x="230" y="170" class="mono k">Shell:</text>
  <text x="315" y="170" class="mono v">bash / zsh</text>

  <text x="230" y="192" class="mono k">Status:</text>
  <text x="315" y="192" class="mono v">Open to interesting projects &amp; collaborations</text>

  <!-- Pixel Color Swatches -->
  <g transform="translate(650, 178)">
    <rect x="0" y="0" width="16" height="16" fill="#0d1117"/>
    <rect x="20" y="0" width="16" height="16" fill="#ff5f56"/>
    <rect x="40" y="0" width="16" height="16" fill="#00ff41"/>
    <rect x="60" y="0" width="16" height="16" fill="#ffbd2e"/>
    <rect x="80" y="0" width="16" height="16" fill="#58a6ff"/>
    <rect x="100" y="0" width="16" height="16" fill="#bc8cff"/>
    <rect x="120" y="0" width="16" height="16" fill="#39c5cf"/>
    <rect x="140" y="0" width="16" height="16" fill="#e6edf3"/>
  </g>

  <rect x="9" y="9" width="832" height="212" fill="url(#scanlinesNeo)"/>
</svg>
