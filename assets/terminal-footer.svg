<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 72" width="850" height="72" shape-rendering="crispEdges">
  <defs>
    <pattern id="scanlinesFooter" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" fill-opacity="0.2"/>
    </pattern>
    <style>
      .mono {
        font-family: ui-monospace, 'Cascadia Mono', 'Segoe UI Mono', 'Liberation Mono', Menlo, Monaco, Consolas, monospace;
      }
      .cursor {
        fill: #00ff41;
        animation: blink 1s steps(1, end) infinite;
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
    </style>
  </defs>

  <rect x="0" y="0" width="850" height="72" fill="#05080b"/>
  <rect x="6" y="4" width="838" height="3" fill="#00ff41" fill-opacity="0.7"/>
  <rect x="6" y="65" width="838" height="3" fill="#00ff41" fill-opacity="0.7"/>
  <rect x="3" y="7" width="3" height="58" fill="#00ff41" fill-opacity="0.7"/>
  <rect x="844" y="7" width="3" height="58" fill="#00ff41" fill-opacity="0.7"/>

  <rect x="9" y="9" width="832" height="54" fill="#0b1015"/>

  <text x="26" y="32" class="mono" fill="#00ff41" font-size="13" font-weight="700">zakaria@github:~$</text>
  <text x="172" y="32" class="mono" fill="#e6edf3" font-size="13">echo "Thanks for stopping by. Keep hacking!"</text>
  <text x="26" y="52" class="mono" fill="#7ee787" font-size="12">[EOF] Connection active — press any repo to explore</text>
  <rect x="394" y="41" width="8" height="13" class="cursor"/>

  <rect x="9" y="9" width="832" height="54" fill="url(#scanlinesFooter)"/>
</svg>
